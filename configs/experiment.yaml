seed: 42
num_questions: 20
dataset_name: rajpurkar/squad
dataset_split: validation
generator_model_id: microsoft/Phi-3-mini-4k-instruct
nli_model_id: cross-encoder/nli-deberta-v3-base
uncertainty_embedding_model_id: sentence-transformers/all-MiniLM-L6-v2
embedding_models:
  minilm: sentence-transformers/all-MiniLM-L6-v2
  bge_small: BAAI/bge-small-en-v1.5
include_bge: true
chunk_sizes: [256, 512]
top_k_values: [3, 5]
chunk_overlap: 50
baseline_embedding: minilm
baseline_chunk_size: 512
baseline_top_k: 3
uncertainty_samples: 3
sample_temperature: 0.7
sample_top_p: 0.9
max_new_tokens: 96
embedding_batch_size: 64
nli_batch_size: 16
checkpoint_every: 10
run_baseline: true
run_adaptive: true
run_oracle: true
run_ablations: true
use_google_drive_cache: false
cache_dir: cache
results_dir: results
device: auto
nli_device: auto

